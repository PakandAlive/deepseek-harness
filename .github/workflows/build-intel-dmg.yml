name: Build Intel macOS DMG

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Official release tag, or latest (includes prereleases)'
        required: true
        default: latest
        type: string
      force:
        description: 'Rebuild even when this fork already has a complete installer release'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fork-intel-dmg
  cancel-in-progress: false

jobs:
  detect:
    name: Check latest official release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.release.outputs.build }}
      source_tag: ${{ steps.release.outputs.source_tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Select official release and skip completed builds
        id: release
        uses: actions/github-script@v8
        env:
          REQUESTED_REF: ${{ inputs.source_ref || 'latest' }}
          FORCE_BUILD: ${{ inputs.force || false }}
        with:
          script: |
            const upstream = { owner: 'deepseek-ai', repo: 'deepseek-harness' };
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...upstream, per_page: 100,
            });
            const candidates = releases.filter(r => !r.draft && r.published_at && r.tag_name.startsWith('dsh-v'));
            candidates.sort((a, b) => Date.parse(b.published_at) - Date.parse(a.published_at));
            const requested = process.env.REQUESTED_REF;
            const selected = requested === 'latest'
              ? candidates[0]
              : candidates.find(r => r.tag_name === requested);
            if (!selected) throw new Error(`No published official release found for ${requested}`);
            const tag = selected.tag_name;
            if (!/^dsh-v[0-9A-Za-z.+-]+$/.test(tag)) throw new Error('Unexpected release tag format');
            const releaseTag = `intel-${tag}`;
            let existing;
            try {
              existing = (await github.rest.repos.getReleaseByTag({
                ...context.repo, tag: releaseTag,
              })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const complete = existing && !existing.draft
              && existing.assets.some(a => a.name.endsWith('.dmg') && a.size > 0)
              && existing.assets.some(a => a.name === 'SHA256SUMS.txt' && a.size > 0);
            const build = process.env.FORCE_BUILD === 'true' || !complete;
            const commit = (await github.rest.repos.getCommit({ ...upstream, ref: tag })).data.sha;
            core.setOutput('build', String(build));
            core.setOutput('source_tag', tag);
            core.setOutput('source_sha', commit);
            core.setOutput('release_tag', releaseTag);
            core.setOutput('prerelease', String(selected.prerelease));
            await core.summary.addHeading('Official release check')
              .addRaw(`Official release: ${tag}\n\nSource commit: ${commit}\n\n${build ? 'Installer build required.' : 'Complete installer already published; skipping build.'}\n`)
              .write();

  package:
    name: Package unsigned Intel DMG
    needs: detect
    if: needs.detect.outputs.build == 'true'
    permissions:
      contents: write
    runs-on: macos-15-intel
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_DESKTOP_TARGET_PLATFORM: darwin
      DSH_DESKTOP_TARGET_ARCH: x64
    steps:
      - name: Check out official source
        uses: actions/checkout@v7.0.1
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ needs.detect.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Set up pinned pnpm from package.json
        uses: pnpm/action-setup@v5.0.0

      - name: Record source and check Intel host
        run: |
          node -e "if (process.platform !== 'darwin' || process.arch !== 'x64') throw Error('Intel macOS runner required')"
          {
            echo '### Intel macOS local build'
            echo "Source commit: $(git rev-parse HEAD)"
            node -p "'Product version: ' + require('./package.json').version"
            echo 'Unsigned DMG with a local ad-hoc app signature; no Apple notarization or automatic updates.'
            echo 'Computer Use helper is not included in this build mode.'
          } >> "$GITHUB_STEP_SUMMARY"
          node --version
          pnpm --version
          xcodebuild -version
          df -h .

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check packaging configuration and toolchain
        run: pnpm run package:desktop:mac:x64:unsigned --check

      - name: Build and verify unsigned DMG
        run: pnpm run package:desktop:mac:x64:unsigned

      - name: Compute installer checksums
        working-directory: apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts
        run: shasum -a 256 ./*.dmg > SHA256SUMS.txt

      - name: Upload Intel installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: deepseek-harness-mac-x64-${{ github.run_id }}
          path: |
            apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts/*.dmg
            apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Publish installer in fork Releases
        working-directory: apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.detect.outputs.release_tag }}
          SOURCE_TAG: ${{ needs.detect.outputs.source_tag }}
          SOURCE_SHA: ${{ needs.detect.outputs.source_sha }}
          IS_PRERELEASE: ${{ needs.detect.outputs.prerelease }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/intel-release-notes.md"
          {
            echo "Intel macOS build of official release $SOURCE_TAG."
            echo
            echo "Source: https://github.com/deepseek-ai/deepseek-harness/commit/$SOURCE_SHA"
            echo
            echo 'Unsigned DMG with a local ad-hoc app signature; no Apple notarization, automatic updates, or Computer Use helper.'
            echo
            echo "Build: https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
          } > "$notes"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$WORKFLOW_SHA" --draft \
              --title "$SOURCE_TAG · Intel macOS unsigned" --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" ./*.dmg SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$IS_PRERELEASE" \
            --latest=false --notes-file "$notes"
          echo "Installer release: https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: intel-packaging-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/desktop/.desktop-build/packaging-runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
